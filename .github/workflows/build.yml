name: Build Unsigned IPA for LiveContainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Force Generate Shared Schemes
        run: |
          # This forces Xcode to scan and open the file, creating a public scheme
          xcodebuild -list -project Settings.xcodeproj

      - name: Clean and Archive Project
        run: |
          xcodebuild archive \
            -project Settings.xcodeproj \
            -scheme Settings \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $GITHUB_WORKSPACE/build/Settings.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package App into IPA Layout
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/Payload
          cp -r $GITHUB_WORKSPACE/build/Settings.xcarchive/Products/Applications/*.app $GITHUB_WORKSPACE/build/Payload/
          cd $GITHUB_WORKSPACE/build
          zip -r Settings-iOS.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-Unsigned-IPA
          path: build/Settings-iOS.ipa
