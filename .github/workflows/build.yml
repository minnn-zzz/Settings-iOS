name: Build Unsigned IPA for LiveContainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15          # or macos-26 / macos-latest if available

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select recent Xcode
        run: |
          # Prefer the newest available Xcode 26.x
          ls /Applications | grep -i Xcode
          # Common paths on current runners – adjust if needed after first run
          if [ -d "/Applications/Xcode_26.4.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app
          elif [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          else
            # fallback to whatever is default / newest
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: List schemes (debug)
        run: xcodebuild -list -project Preferences.xcodeproj

      - name: Clean and Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Preferences.xcodeproj \
            -scheme Preferences \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $GITHUB_WORKSPACE/build/Preferences.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package into IPA
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/Payload
          cp -r $GITHUB_WORKSPACE/build/Preferences.xcarchive/Products/Applications/*.app \
                $GITHUB_WORKSPACE/build/Payload/
          cd $GITHUB_WORKSPACE/build
          zip -r Settings-iOS.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-Unsigned-IPA
          path: build/Settings-iOS.ipa
          retention-days: 7
