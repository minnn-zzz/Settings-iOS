name: Build Unsigned IPA for LiveContainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compile Native Binary Target
        run: |
          xcodebuild \
            -project Settings-iOS.xcodeproj \
            -target Settings-iOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Package App into IPA Layout
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/Payload
          cp -r build/Release-iphoneos/Settings-iOS.app $GITHUB_WORKSPACE/build/Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app $GITHUB_WORKSPACE/build/Payload/
          cd $GITHUB_WORKSPACE/build
          zip -r Settings-iOS.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Settings-iOS-Unsigned-IPA
          path: build/Settings-iOS.ipa
